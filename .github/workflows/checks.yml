name: Landscape checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: npm install --prefix /tmp/landscape-browser playwright@1.56.1
      - run: node tests/landscape-journey.cjs
        env:
          PLAYWRIGHT_MODULE: /tmp/landscape-browser/node_modules/playwright
